# One-group end-to-end gate for async NeMo-Gym through SingleController and TQ.
defaults: ./grpo-nemotron3.5-lightning-30ba3b-4n8g-megatron-async-gym-harbor-stress-32x16-age4-r3-one-step.yaml

grpo:
  num_prompts_per_step: 1
  num_generations_per_prompt: 16
  val_period: 0
  val_at_start: false
  val_at_end: false

policy:
  train_global_batch_size: 16
  generation_batch_size: 16
  # Exercise the full Gym + TQ + R3 path after the no-R3 transport control.
  router_replay:
    enabled: true

checkpointing:
  enabled: false

data_plane:
  enabled: true
  impl: transfer_queue
  backend: simple
  storage_capacity: 1000000
  num_storage_units: 2
  claim_meta_poll_interval_s: 0.5
  global_segment_size: 549755813888
  local_buffer_size: 68719476736
  observability:
    enabled: true
    packing_memory_enabled: true

async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 0
  min_groups_for_streaming_train: 1
  max_inflight_prompts: 1
  max_buffered_rollouts: 1
  diagnostics: true

logger:
  log_dir: logs/grpo-nemotron3.5-lightning-harbor-sc-tq-1x16
  wandb:
    name: grpo-nemotron3.5-lightning-harbor-sc-tq-1x16
